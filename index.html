<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13203f">
<meta name="description" content="Globetrotter: a travel adventure to discover England and the English-speaking world. By BROT2YOU APP.">
<title>Globetrotter</title>
<link rel="icon" href="assets/england_flag.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --night:#13203f; --night2:#1b2c55; --night3:#24386a;
  --gold:#f3c34e; --gold2:#c98b1c; --paper:#fbf1d9; --paper2:#f3e3bd;
  --ink:#23304f; --ink2:#5a6582; --stamp:#c8372d; --thames:#2696b0;
  --ok:#2e8f57; --ko:#c8372d; --radius:14px;
  --head:'Lilita One','Trebuchet MS',sans-serif; --body:'Lexend','Trebuchet MS',Verdana,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{font-size:16px}
body{background:var(--night);color:#fff;font-family:var(--body);font-size:1rem;line-height:1.5;
  background-image:radial-gradient(ellipse at 50% -10%,#2a4078 0,rgba(42,64,120,0) 60%);background-attachment:fixed;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;height:auto;display:block}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--head);font-weight:400;letter-spacing:.01em;line-height:1.15;margin:0 0 .4em}
h2{font-size:2rem} h3{font-size:1.35rem}
p{margin:0 0 .8em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px 48px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;border-radius:999px;padding:.75em 1.4em;
  font-family:var(--head);font-size:1.15rem;letter-spacing:.02em;background:var(--gold);color:var(--night);
  box-shadow:0 4px 0 var(--gold2);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold2)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.btn.ink{background:var(--night);color:#fff;box-shadow:0 4px 0 #0a1226}
.btn.small{font-size:.95rem;padding:.5em 1em}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.speak{border:0;background:rgba(38,150,176,.15);color:var(--thames);border-radius:999px;width:2.2em;height:2.2em;flex:none;
  display:inline-flex;align-items:center;justify-content:center;font-size:1rem}
.speak:hover{background:rgba(38,150,176,.3)}
.frbtn{border:0;background:transparent;color:var(--ink2);font-size:.8rem;text-decoration:underline;padding:2px 4px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(19,32,63,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(243,195,78,.25);margin-bottom:22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--night);z-index:21}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 18px}
.home-btn{border:0;background:none;padding:0;display:flex;align-items:center}
.home-btn img{height:42px;width:auto}
.top-title{font-family:var(--head);font-size:1.3rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--night2);border:1px solid rgba(255,255,255,.15);border-radius:999px;
  padding:5px 12px;font-size:.9rem;font-weight:600;white-space:nowrap}
.chip.tog{cursor:pointer}
.chip.tog.on{background:var(--gold);color:var(--night);border-color:var(--gold)}
@media (max-width:640px){.top-title{font-size:1.05rem}.chip.hide-s{display:none}.home-btn img{height:34px}}

/* ---------- home ---------- */
.home{min-height:100vh;display:flex;flex-direction:column}
.hero{position:relative;max-width:1240px;width:calc(100% - 36px);margin:18px auto 0;border-radius:22px;overflow:hidden;
  border:4px solid var(--gold);box-shadow:0 0 0 3px var(--night),0 0 0 6px rgba(243,195,78,.35);aspect-ratio:16/9;max-height:calc(100vh - 90px);min-height:520px;background:#4a7fbf}
.hero-art{position:absolute;inset:0;background:url(assets/home/background.webp) center/cover no-repeat}
.hero-logo{position:absolute;left:36%;top:4%;width:40%;transform:translateX(-50%)}
.hero-menu{position:absolute;right:2%;top:4%;bottom:4%;width:23%;display:flex;flex-direction:column;justify-content:space-between}
.menu-b{border:0;background:none;padding:0;transition:transform .12s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.menu-b:hover{transform:translateX(-4px) scale(1.02)}
.menu-b img{width:100%}
.hero-cta{position:absolute;left:59%;bottom:6%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:90%}
.hero-cta .btn{font-size:1.5rem;padding:.7em 1.8em}
.hero-cta .next{background:rgba(19,32,63,.88);border-radius:999px;padding:4px 14px;font-size:.9rem}
.explorer{position:absolute;left:2%;top:3.5%;display:flex;align-items:center;gap:10px;background:rgba(19,32,63,.88);
  border:2px solid var(--gold);border-radius:999px;padding:4px 16px 4px 4px;font-weight:600;line-height:1.2}
.explorer img{width:38px;height:auto;margin:-6px 0}
.explorer small{display:block;font-weight:400;opacity:.8;font-size:.75rem}
.foot{text-align:center;font-size:.8rem;opacity:.65;padding:16px}
@media (max-width:860px){
  .hero{aspect-ratio:auto;max-height:none;min-height:calc(100vh - 24px);border-radius:18px;width:calc(100% - 24px);margin-top:12px;
    background:#4a7fbf url(assets/home/background_mobile.webp) center bottom/cover no-repeat;display:flex;flex-direction:column}
  .hero-art{position:relative;inset:auto;background:none;flex:1;min-height:118vw;display:flex;flex-direction:column;align-items:center;padding:12px 12px 0}
  .hero-logo{position:static;transform:none;width:88%;margin-top:34px}
  .hero-cta{position:static;transform:none;width:92%;max-width:none;margin-top:6px}
  .hero-cta .btn{width:100%;font-size:1.35rem;box-shadow:0 4px 0 var(--gold2),0 6px 18px rgba(0,0,0,.35)}
  .explorer{left:10px;top:10px;padding:2px 12px 2px 2px;font-size:.85rem}
  .explorer img{width:30px;height:auto}
  .hero-menu{position:static;width:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;padding:10px 8px 12px;background:none}
  .menu-b{filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
  .menu-b:hover{transform:none}
}
/* ---------- paper panels ---------- */
.paper{background:var(--paper);color:var(--ink);border-radius:var(--radius);padding:22px;box-shadow:0 0 0 3px var(--gold),0 0 0 6px var(--night),0 10px 30px rgba(0,0,0,.35)}
.paper .muted{color:var(--ink2)}
.head{margin-bottom:18px}
.head p{opacity:.85;max-width:62ch}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.bar{height:10px;border-radius:999px;background:rgba(35,48,79,.15);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold2);border-radius:999px}
.empty{padding:26px;text-align:center;border:2px dashed rgba(35,48,79,.25);border-radius:var(--radius);color:var(--ink2)}

/* ---------- map ---------- */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{border:2px solid var(--gold);background:transparent;color:#fff;border-radius:999px;padding:.45em 1.2em;font-family:var(--head);font-size:1.1rem}
.tab.on{background:var(--gold);color:var(--night)}
.tab[disabled]{opacity:.5;cursor:not-allowed}
.mapbox{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:0 0 0 3px var(--gold),0 0 0 6px var(--night)}
.mapbox img{width:100%}
.mapbox.pixel img{image-rendering:pixelated}
.mapbox.tall{max-width:min(540px,calc((100vh - 170px) * .75));margin:0 auto}
.pin{position:absolute;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:50%;width:46px;height:46px;
  background:var(--gold);color:var(--night);font-size:1.3rem;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 rgba(0,0,0,.35);padding:0}
.pin.open{animation:pulse 1.8s infinite}
.pin.done{background:var(--stamp);color:#fff}
.pin.gold{background:linear-gradient(135deg,#ffe48a,#d99a1e);color:var(--night)}
.pin.lock{background:#7b8397;color:#fff;cursor:not-allowed}
.pin .lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;background:rgba(19,32,63,.9);color:#fff;
  font-size:.72rem;padding:2px 8px;border-radius:999px;white-space:nowrap;font-family:var(--body);font-weight:600}
@keyframes pulse{0%,100%{box-shadow:0 3px 0 rgba(0,0,0,.35),0 0 0 0 rgba(243,195,78,.7)}50%{box-shadow:0 3px 0 rgba(0,0,0,.35),0 0 0 12px rgba(243,195,78,0)}}
.layout-map{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:24px;align-items:start}
@media (max-width:900px){.layout-map{grid-template-columns:1fr}}
.plist{display:flex;flex-direction:column;gap:10px}
.pitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--paper);color:var(--ink);border-radius:12px;padding:8px;
  box-shadow:0 3px 0 rgba(0,0,0,.3)}
.pitem .th{width:64px;height:52px;border-radius:8px;background:#ccc center/cover;flex:none}
.pitem .th.pixel{image-rendering:pixelated}
.pitem b{font-family:var(--head);font-weight:400;font-size:1.1rem;display:block;line-height:1.1}
.pitem small{color:var(--ink2)}
.pitem .st{margin-left:auto;font-size:1.3rem;padding-right:6px}
.pitem.lock{opacity:.55;cursor:not-allowed}
.notice{background:rgba(243,195,78,.12);border:1px solid rgba(243,195,78,.5);border-radius:12px;padding:10px 14px;margin-bottom:14px}

/* ---------- place ---------- */
.place{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:26px;align-items:start}
.place.portrait{grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr)}
@media (max-width:860px){.place,.place.portrait{grid-template-columns:1fr}}
.scene-col{position:sticky;top:84px}
@media (max-width:860px){.scene-col{position:static}}
.scene{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:0 0 0 3px var(--gold),0 0 0 6px var(--night);background:#000}
.scene img{width:100%;height:auto}
.scene.pixel img{image-rendering:pixelated}
.place.portrait .scene{max-width:380px;margin:0 auto}
@media (max-width:860px){.place.portrait .scene{max-width:320px}}
.hot{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:rgba(19,32,63,.75);
  color:#fff;font-size:1.35rem;display:flex;align-items:center;justify-content:center;padding:0;animation:pulse 1.8s infinite}
.hot.found{background:var(--ok);animation:none}
.hot.sel{outline:4px solid var(--gold)}
.steps{display:flex;gap:6px;margin-bottom:14px;padding:0;list-style:none;counter-reset:s}
.steps li{flex:1;text-align:center;font-size:.8rem;font-weight:600;padding:6px 4px;border-radius:999px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.65)}
.steps li.cur{background:var(--gold);color:var(--night)}
.steps li.done{background:rgba(46,143,87,.35);color:#fff}
.guide-tag{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.guide-tag b{font-family:var(--head);font-weight:400;font-size:1.4rem}
.mono{width:44px;height:44px;border-radius:50%;color:#fff;font-family:var(--head);font-size:1.3rem;display:flex;align-items:center;justify-content:center;flex:none;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pic{display:block;width:3.2rem;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.pic img{width:100%;height:auto}
.pic.big{width:5.6rem}
.mono.big{width:4rem;height:4rem;font-size:1.8rem}
.talk{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.line{display:flex;gap:10px;align-items:flex-start}
.line.you{flex-direction:row-reverse}
.bubble{background:#fff;border-radius:16px 16px 16px 4px;padding:10px 14px;max-width:80%;box-shadow:0 2px 0 rgba(35,48,79,.15);position:relative}
.line.you .bubble{border-radius:16px 16px 4px 16px;background:#e3f1f5}
.bubble .who{font-size:.75rem;font-weight:700;color:var(--ink2);display:block}
.bubble .tx{display:flex;gap:8px;align-items:flex-start}
.bubble .tx span{flex:1}
.fr{font-size:.88rem;color:var(--ink2);font-style:italic;margin-top:4px;display:block}
.line.pop{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.opts{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.opt{text-align:left;border:2px solid rgba(35,48,79,.2);background:#fff;color:var(--ink);border-radius:12px;padding:12px 14px;font-weight:500}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:#e2f4e9}
.opt.ko{border-color:var(--ko);background:#fbe5e3}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:10px 14px;margin:8px 0;font-weight:500}
.fb.ok{background:#e2f4e9;color:#1d5e39}
.fb.ko{background:#fbe5e3;color:#8a231c}
.clue{background:#fff;border-radius:12px;padding:14px;margin:12px 0;border-left:6px solid var(--thames)}
.clue h3{margin-bottom:.3em}
.word{display:inline-flex;align-items:center;gap:8px;background:var(--paper2);border-radius:999px;padding:4px 6px 4px 14px;font-weight:600;margin-top:6px}
.word em{font-style:normal;font-weight:400;color:var(--ink2)}
.counter{font-weight:700;margin-bottom:8px}
.qnum{font-size:.85rem;font-weight:700;color:var(--ink2);margin-bottom:4px}
.listen-big{display:flex;align-items:center;gap:12px;background:#e3f1f5;border-radius:12px;padding:12px;margin:8px 0}
.listen-big .speak{width:3.2em;height:3.2em;font-size:1.4rem;background:var(--thames);color:#fff}
.transcript{font-style:italic;color:var(--ink2)}

/* ---------- reward ---------- */
.reward{text-align:center}
.stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:170px;height:170px;border-radius:50%;
  border:5px double var(--stamp);color:var(--stamp);font-family:var(--head);text-transform:uppercase;letter-spacing:.06em;
  transform:rotate(-8deg);margin:6px auto 14px;padding:12px;text-align:center;line-height:1.05;
  background:radial-gradient(circle,rgba(200,55,45,.06),rgba(200,55,45,0) 70%)}
.stamp .s1{font-size:.75rem}
.stamp .s2{font-size:1.3rem;margin:4px 0}
.stamp .s3{font-size:.7rem;font-family:var(--body);font-weight:700}
.stamp.thud{animation:thud .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes thud{0%{transform:rotate(-8deg) scale(2.2);opacity:0}60%{opacity:1}100%{transform:rotate(-8deg) scale(1)}}
.score{font-size:1.1rem;margin-bottom:10px}
.miles-sum{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:4px 0 16px}
.miles-sum span{background:var(--paper2);border-radius:999px;padding:3px 12px;font-size:.88rem;font-weight:600}
.miles-sum span.tot{background:var(--night);color:#fff}
.done-chip{background:var(--ok);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;white-space:nowrap}

/* ---------- cards ---------- */
.card{position:relative;border:0;padding:8px;background:var(--night);border-radius:14px;box-shadow:0 0 0 3px #b9c0cf;color:#fff;text-align:center;width:100%}
.card.silver{box-shadow:0 0 0 3px #d9dee8,0 6px 0 rgba(0,0,0,.3)}
.card.gold{box-shadow:0 0 0 3px var(--gold),0 6px 0 rgba(0,0,0,.3)}
.card.gold::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,240,180,.35) 50%,rgba(255,255,255,0) 65%);background-size:250% 100%;animation:shine 3.5s infinite}
@keyframes shine{0%{background-position:120% 0}100%{background-position:-120% 0}}
.card .art{aspect-ratio:3/4;border-radius:8px;background:#2c3a5e center/cover no-repeat}
.card .art.pixel{image-rendering:pixelated}
.card b{display:block;font-family:var(--head);font-weight:400;font-size:1.05rem;margin-top:6px;line-height:1.1}
.card small{opacity:.75;font-size:.75rem}
.card .rar{position:absolute;top:14px;left:14px;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;background:#d9dee8;color:var(--night)}
.card.gold .rar{background:var(--gold)}
.card.locked .art{background:repeating-linear-gradient(45deg,#24386a 0 12px,#1b2c55 12px 24px);display:flex;align-items:center;justify-content:center;font-size:2.5rem}
.badge{display:flex;gap:12px;align-items:center;background:var(--paper);color:var(--ink);border-radius:12px;padding:12px}
.badge .bi{width:52px;height:52px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex:none;border:3px solid var(--gold2)}
.badge.off{opacity:.55}
.badge.off .bi{background:#c8ccd6;border-color:#9aa1b2;filter:grayscale(1)}
.badge b{font-family:var(--head);font-weight:400;font-size:1.1rem;display:block}
.badge small{color:var(--ink2)}

/* ---------- passport ---------- */
.passport{display:grid;grid-template-columns:1fr 1.4fr;gap:0;border-radius:18px;overflow:hidden;box-shadow:0 0 0 6px #7a1f2b,0 0 0 9px var(--gold),0 14px 40px rgba(0,0,0,.4)}
@media (max-width:820px){.passport{grid-template-columns:1fr}}
.pp-page{background:var(--paper);color:var(--ink);padding:24px;position:relative;
  background-image:repeating-linear-gradient(0deg,rgba(35,48,79,.04) 0 2px,transparent 2px 22px)}
.pp-page+.pp-page{border-left:2px dashed rgba(35,48,79,.2)}
@media (max-width:820px){.pp-page+.pp-page{border-left:0;border-top:2px dashed rgba(35,48,79,.2)}}
.pp-id{display:flex;gap:16px;align-items:center;margin:12px 0 16px}
.pp-photo{width:120px;height:140px;background:#dfe7ef;border:2px solid var(--ink);border-radius:6px;overflow:hidden;flex:none}
.pp-photo img{width:100%;height:100%;object-fit:contain;padding:6px}
.pp-field small{display:block;font-size:.7rem;color:var(--ink2);font-weight:700;letter-spacing:.04em}
.pp-field{margin-bottom:8px}
.pp-field b{font-size:1.05rem}
.mrz{font-family:'Courier New',monospace;font-size:.82rem;letter-spacing:.12em;word-break:break-all;color:var(--ink2);margin-top:14px;border-top:1px solid rgba(35,48,79,.2);padding-top:10px}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.pst{aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.pst .st{width:100%;height:100%;border-radius:50%;border:4px double;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;font-family:var(--head);text-transform:uppercase;line-height:1.05;padding:8px;font-size:.85rem}
.pst .st small{font-family:var(--body);font-size:.6rem;font-weight:700;margin-top:3px}
.pst .st.rect{border-radius:8px}
.pst.empty .st{border:2px dashed rgba(35,48,79,.25);color:rgba(35,48,79,.35);font-family:var(--body);font-size:.7rem;text-transform:none}

/* ---------- guide / words ---------- */
.fact{background:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.fact.lock{background:transparent;border:2px dashed rgba(35,48,79,.25);color:var(--ink2)}
.fact .ic{font-size:1.4rem;line-height:1}
.fact b{display:block}
.sect{margin-bottom:22px}
.sect h3{display:flex;align-items:center;gap:8px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.wcard{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px}
.wcard b{display:block;font-size:1.05rem}
.wcard small{color:var(--ink2)}
.wcard .speak{margin-left:auto}
.wcard.lock{background:transparent;border:2px dashed rgba(35,48,79,.25);color:var(--ink2)}

/* ---------- travels ---------- */
.world{border-radius:var(--radius);overflow:hidden;box-shadow:0 0 0 3px var(--gold),0 0 0 6px var(--night);margin-bottom:22px}

.dest{position:relative;border:0;background:none;padding:0}
.dest img{width:100%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.dest.soon img{filter:grayscale(.75) brightness(.8)}
.dest .soon-t{position:absolute;right:6%;top:4%;background:var(--night);border:2px solid var(--gold);color:var(--gold);font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px}
.dest .play-t{position:absolute;right:6%;top:4%;background:var(--ok);border:2px solid #fff;color:#fff;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px}

/* ---------- missions ---------- */
.mission{display:flex;gap:16px;align-items:center}
.mission .mi{font-size:2rem;width:64px;height:64px;border-radius:16px;background:var(--paper2);display:flex;align-items:center;justify-content:center;flex:none}
.mission .mb{flex:1;min-width:0}
.mission.off{opacity:.6}

/* ---------- forms / settings ---------- */
label.f{display:block;font-weight:700;margin:12px 0 6px}
input.tx{width:100%;max-width:360px;font:inherit;padding:.65em .9em;border-radius:10px;border:2px solid rgba(35,48,79,.3);background:#fff;color:var(--ink)}
.avs{display:flex;gap:10px;flex-wrap:wrap}
.av{border:3px solid transparent;border-radius:14px;padding:4px;background:transparent;width:96px}
.av img{width:100%;height:auto}
.av.on{border-color:var(--night);box-shadow:0 0 0 3px var(--gold);transform:scale(1.06)}
.av:not(.on){opacity:.7}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(35,48,79,.15);flex-wrap:wrap}
.set:last-child{border-bottom:0}
.seg{display:inline-flex;border-radius:999px;overflow:hidden;border:2px solid var(--ink)}
.seg button{border:0;background:transparent;padding:6px 14px;font-weight:600;color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff}

/* ---------- modal / toast ---------- */
.shade{position:fixed;inset:0;background:rgba(10,18,38,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{max-width:460px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--night);border:2px solid var(--gold);color:#fff;
  padding:10px 18px;border-radius:999px;z-index:60;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:92vw;text-align:center;animation:pop .2s}

        o = [w.fr]; for (k = 0; k < others.length; k++) { o.push(others[k].fr); }
        qs.push({ t: 'listen', say: w.en, q: 'What does this word mean?', o: o, why: w.en + ' = ' + w.fr + '.', from: w.place.name });
      }
    }
    RV = newRun(qs); RV.gained = 0;
    return true;
  }
  function vReview() {
    if (!RV) { return vWords(); }
    var body;
    if (RV.i >= RV.qs.length) {
      var sc = 0, i; for (i = 0; i < RV.results.length; i++) { if (RV.results[i]) { sc++; } }
      body = '<div class="reward"><h2>' + sc + '/' + RV.qs.length + '</h2><p>' + (RV.gained ? '+' + RV.gained + ' miles today.' : 'Daily miles limit reached: keep practising, it still counts for the Word Master badge!') + '</p>' +
        '<p class="muted">Right answers in total: ' + S.review.total + (S.review.total < 30 ? '/30 for the Word Master badge' : ' · Word Master badge won!') + '</p>' +
        '<div class="row" style="justify-content:center"><button class="btn" data-act="go" data-v="review">Practise again</button><button class="btn ghost" data-act="go" data-v="words">My words</button></div></div>';
    } else { body = quizHTML(RV, 'review'); }
    return top('Word practice') + '<main class="wrap"><div class="paper" style="max-width:720px;margin:0 auto">' + body + '</div></main>';
  }

  /* ----- examen ----- */
  function startExam() {
    var pool = [], i, j, p, q;
    for (i = 0; i < C.places.length; i++) {
      p = C.places[i];
      for (j = 0; j < p.quiz.length; j++) { q = extend({}, p.quiz[j]); q.from = p.name; pool.push(q); }
    }
    EX = newRun(shuffle(pool).slice(0, 10));
  }
  function vExam() {
    if (!examOpen()) { return vMissions(); }
    var body, ex = country().exam;
    if (!EX) {
      body = '<h2>The England exam</h2><p>10 questions taken from all the places in England. Some are listening questions: use 🔊.</p><p>Score <b>8 or more</b> to get your <b>explorer visa</b> in your passport and the England Explorer badge.</p>' +
        (ex.best ? '<p class="muted">Best score: ' + ex.best + '/10</p>' : '') + '<button class="btn" data-act="startexam">Start the exam</button>';
    } else if (EX.i >= EX.qs.length) {
      body = '<div class="reward"><h2>' + EX.score + '/10</h2>' + (EX.score >= 8 ? '<div class="stamp thud" style="border-radius:12px;color:#7a1f2b;border-color:#7a1f2b"><span class="s1">England</span><span class="s2">Explorer visa</span><span class="s3">APPROVED</span></div><p>Brilliant! Your explorer visa is in your passport.' + (EX.newPass ? ' +50 miles.' : '') + '</p>' :
        '<p>You need 8/10 for the visa. Visit the Field Guide to revise, then try again.</p>') +
        '<div class="row" style="justify-content:center"><button class="btn" data-act="startexam">Try again</button><button class="btn ghost" data-act="go" data-v="guide">Field Guide</button><button class="btn ghost" data-act="go" data-v="passport">My passport</button></div></div>';
    } else { body = quizHTML(EX, 'exam'); }
    return top('England exam') + '<main class="wrap"><div class="paper" style="max-width:760px;margin:0 auto">' + body + '</div></main>';
  }

  /* ----- voyages ----- */
  function vTravels() {
    var i, d, h = '';
    for (i = 0; i < DATA.destinations.length; i++) {
      d = DATA.destinations[i];
      h += '<button class="dest' + (d.status === 'playable' ? '' : ' soon') + '" data-act="dest" data-id="' + d.id + '"><img src="assets/countries/countries_' + d.img + '.webp" alt="' + esc(d.name) + '">' +
        (d.status === 'playable' ? '<span class="play-t">PLAY</span>' : '<span class="soon-t">SOON</span>') + '</button>';
    }
    return top('My Travels') + '<main class="wrap"><div class="head"><h2>The English-speaking world</h2><p>English is spoken all over the world. England is your first destination; new countries will open here.</p></div>' +
      '<div class="world"><img src="assets/home/world_map.webp" alt="Illustrated world map" width="1672" height="941"></div><div class="grid g3">' + h + '</div></main>';
  }

  /* ----- réglages ----- */
  function vSettings() {
    var i, av = '', st = S.settings;
    if (S.explorer && draft.name === '' && !draft.touched) { draft.name = S.explorer.name; draft.avatar = S.explorer.avatar || 0; }
    for (i = 0; i < AVATARS.length; i++) {
      av += '<button class="av' + (draft.avatar === i ? ' on' : '') + '" data-act="avatar" data-i="' + i + '" aria-label="Avatar ' + (i + 1) + '" aria-pressed="' + (draft.avatar === i) + '"><img src="' + AVATARS[i] + '" alt=""></button>';
    }
    function seg(key, opts) {
      var h = '<span class="seg">', k;
      for (k = 0; k < opts.length; k++) { h += '<button data-act="set" data-k="' + key + '" data-val="' + opts[k][0] + '" class="' + (String(st[key]) === String(opts[k][0]) ? 'on' : '') + '">' + opts[k][1] + '</button>'; }
      return h + '</span>';
    }
    return top('Settings') + '<main class="wrap"><div class="grid" style="max-width:760px;margin:0 auto">' +
      (S.explorer ? '<div class="paper"><h3>My passport</h3><label class="f" for="pname">First name</label><input id="pname" class="tx" maxlength="20" value="' + esc(draft.name) + '"><label class="f">Photo</label><div class="avs">' + av + '</div>' +
        '<p style="margin-top:14px"><button class="btn small" data-act="saveprofile">Save</button></p></div>' : '') +
      '<div class="paper"><h3>Help and sound</h3>' +
      '<div class="set"><span><b>French help</b><br><small class="muted">Show French translations under texts</small></span>' + seg('fr', [['false', 'Off'], ['true', 'On']]) + '</div>' +
      '<div class="set"><span><b>Voice speed</b><br><small class="muted">British English voice of your device</small></span><span class="row">' + seg('rate', [['normal', 'Normal'], ['slow', 'Slow']]) + speakBtn('Hello! Welcome to England. Have a great trip!', 'Test the voice') + '</span></div>' +
      '<div class="set"><span><b>Sound effects</b></span>' + seg('sfx', [['true', 'On'], ['false', 'Off']]) + '</div></div>' +
      '<div class="paper"><h3>My progress</h3><p class="muted">Your progress is saved in this browser only. Export it to keep a copy or to continue on another device.</p>' +
      '<div class="row"><button class="btn small" data-act="export">Export my progress</button><button class="btn small ghost" data-act="import">Import a file</button>' +
      '<button class="btn small ghost" data-act="askreset" style="color:var(--ko)">Start again from zero</button></div>' +
      '<input type="file" id="impfile" accept=".json,application/json" hidden>' +
      (legacyFound() ? '<div class="set" style="margin-top:10px"><span><b>Old version data found</b><br><small class="muted">Progress from Atlas Quest / Worldhop / Globetrotter v0.x is no longer used.</small></span><button class="btn small ghost" data-act="cleanlegacy">Delete old data</button></div>' : '') +
      '</div><div class="paper"><h3>About</h3><p>Globetrotter · a travel adventure to discover the English-speaking world.</p><p class="muted">Free, no account, no advertising, works offline once loaded. Speech uses the voices installed on your device. Illustrated maps are artistic, not to scale. By BROT2YOU APP.</p></div>' +
      '</div></main>';
  }

  /* ---------------- modale et toast ---------------- */
  function modalHTML() {
    if (!modal) { return ''; }
    var inner = '';
    if (modal.kind === 'reset') {
      inner = '<h3>Start again from zero?</h3><p>All stamps, cards, words and miles in this browser will be deleted. Export your progress first if you want to keep it.</p>' +
        '<div class="row"><button class="btn" data-act="doreset" style="background:var(--ko);color:#fff;box-shadow:0 4px 0 #7d1f18">Delete everything</button><button class="btn ghost" data-act="closemodal">Cancel</button></div>';
    } else if (modal.kind === 'card') {
      var p = place(modal.id), st = ps(p.id), j, f = '';
      for (j = 0; j < p.clues.length; j++) { if (has(st.clues, j)) { f += '<li>' + esc(p.clues[j].fact) + '</li>'; } }
      inner = cardHTML(p, { big: true }) + '<h3 style="margin-top:14px">' + esc(p.name) + '</h3><ul style="padding-left:1.2em">' + f + '</ul>' +
        '<div class="row"><button class="btn small" data-act="place" data-id="' + p.id + '">Visit again</button><button class="btn small ghost" data-act="closemodal">Close</button></div>';
    }
    return '<div class="shade" data-act="shade"><div class="paper modal" role="dialog" aria-modal="true">' + inner + '</div></div>';
  }
  function toast(msg) {
    var old = document.getElementById('toast');
    if (old) { old.parentNode.removeChild(old); }
    var t = document.createElement('div');
    t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { if (t.parentNode) { t.parentNode.removeChild(t); } }, 2800);
  }

  /* ---------------- rendu ---------------- */
  var VIEWS = { home: vHome, create: vCreate, map: vMap, place: vPlace, passport: vPassport, missions: vMissions, cards: vCards,
    guide: vGuide, words: vWords, review: vReview, exam: vExam, travels: vTravels, settings: vSettings };
  function render() {
    var fn = VIEWS[V.name] || vHome;
    if (V.name === 'place' && !P) { fn = vMap; }
    app.innerHTML = fn() + modalHTML();
    document.title = 'Globetrotter' + (V.name === 'place' && P ? ' · ' + place(P.id).name : '');
  }
  function go(name) {
    var needsExplorer = ['map', 'place', 'passport', 'missions', 'exam', 'review'];
    if (!S.explorer && has(needsExplorer, name)) { name = 'create'; }
    if (name === 'review' && !startReview()) { name = 'words'; }
    if (name === 'exam') { EX = null; }
    if (name === 'settings' || name === 'create') { draft.touched = false; if (name === 'settings') { draft.name = ''; } }
    V = { name: name, tab: V.tab };
    modal = null;
    if (window.speechSynthesis) { window.speechSynthesis.cancel(); }
    window.scrollTo(0, 0);
    render();
  }

  /* ---------------- actions ---------------- */
  function finishPlaceQuiz() {
    var p = place(P.id), st = ps(p.id), sc = 0, i, r = { score: 0, newStamp: false };
    var beyondBefore = beyondOpen(), examBefore = examOpen();
    for (i = 0; i < P.run.results.length; i++) { if (P.run.results[i]) { sc++; } }
    r.score = sc;
    if (sc > st.best) { st.best = sc; }
    if (sc >= 2 && !st.stamp) {
      st.stamp = true; st.date = today(); r.newStamp = true;
      addMiles(10, LABELS.stamp, P.gained);
    }
    if (sc === 3 && !st.goldDone) { st.goldDone = true; addMiles(10, LABELS.gold, P.gained); }
    r.unlockedBeyond = !beyondBefore && beyondOpen();
    r.unlockedExam = !examBefore && examOpen();
    P.result = r; P.step = 3; P.max = 3;
    persist();
    sfx(sc >= 2 ? (r.newStamp ? 'stamp' : 'win') : 'ko');
    if (r.newStamp) { setTimeout(function () { sfx('win'); }, 350); }
  }
  function onPick(ctx, j) {
    var run = ctx === 'place' ? P.run : ctx === 'exam' ? EX : RV, q, ok, p, st;
    if (!run || run.picked >= 0) { return; }
    run.picked = j;
    q = run.qs[run.i];
    ok = run.orders[run.i][j] === 0;
    run.results.push(ok);
    sfx(ok ? 'ok' : 'ko');
    if (ok && ctx === 'place') {
      p = place(P.id); st = ps(p.id);
      if (!has(st.correct, run.i)) { st.correct.push(run.i); addMiles(5, LABELS.answer, P.gained); persist(); }
    }
    if (ctx === 'review') {
      if (S.review.day !== today()) { S.review.day = today(); S.review.count = 0; }
      if (ok) {
        S.review.total++;
        if (S.review.count < 10) { S.review.count++; RV.gained++; addMiles(1); }
      }
      persist();
    }
    render();
  }
  function onNext(ctx) {
    var run = ctx === 'place' ? P.run : ctx === 'exam' ? EX : RV, i, sc = 0, ex;
    if (!run) { return; }
    run.i++; run.picked = -1;
    if (run.i >= run.qs.length) {
      if (ctx === 'place') { finishPlaceQuiz(); }
      if (ctx === 'exam') {
        for (i = 0; i < run.results.length; i++) { if (run.results[i]) { sc++; } }
        run.score = sc; ex = country().exam;
        if (sc > ex.best) { ex.best = sc; }
        if (sc >= 8 && !ex.passed) { ex.passed = true; run.newPass = true; addMiles(50); }
        persist();
        sfx(sc >= 8 ? 'stamp' : 'ko');
      }
      if (ctx === 'review') { sfx('win'); }
    }
    window.scrollTo(0, 0);
    render();
  }
  function download(text, name) {
    try {
      var blob = new Blob([text], { type: 'application/json' }), url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.parentNode.removeChild(a); }, 500);
      toast('Progress exported.');
    } catch (e) { toast('Export failed on this browser.'); }
  }

  document.addEventListener('click', function (e) {
    var b = closest(e.target, '[data-act]');
    if (!b || b.disabled) { return; }
    var act = b.getAttribute('data-act'), p, st, i, o;
    if (act === 'shade') { if (e.target === b) { modal = null; render(); } return; }
    switch (act) {
      case 'go': go(b.getAttribute('data-v')); break;
      case 'continue':
        o = nextStep();
        if (o.kind === 'place') { openPlace(o.place.id); } else if (o.kind === 'exam') { go('exam'); } else { go('map'); }
        break;
      case 'say': speak(b.getAttribute('data-say')); break;
      case 'fr': S.settings.fr = !S.settings.fr; persist(); render(); break;
      case 'tab': V.tab = b.getAttribute('data-t'); render(); break;
      case 'maptab': V.tab = b.getAttribute('data-t'); go('map'); break;
      case 'place': modal = null; openPlace(b.getAttribute('data-id')); break;
      case 'nextline': P.line++; render(); break;
      case 'reply':
        p = place(P.id); i = Number(b.getAttribute('data-i')); st = ps(p.id);
        if (p.reply.o[i][1]) {
          if (!st.reply && !P.tried.length) { addMiles(3, LABELS.reply, P.gained); }
          st.reply = true; P.replyOk = true; persist(); sfx('ok');
        } else { P.tried.push(i); sfx('ko'); }
        render();
        break;
      case 'step':
        P.step = Number(b.getAttribute('data-n')); if (P.step > P.max) { P.max = P.step; }
        P.clue = -1; window.scrollTo(0, 0); render();
        break;
      case 'clue':
        if (P.step !== 1) { P.step = 1; }
        p = place(P.id); st = ps(p.id); i = Number(b.getAttribute('data-i'));
        if (!has(st.clues, i)) { st.clues.push(i); addMiles(2, LABELS.clue, P.gained); persist(); sfx('ok'); }
        P.clue = i; render();
        o = document.getElementById('cluebox');
        if (o && window.innerWidth < 860) { try { o.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (err) { o.scrollIntoView(); } }
        break;
      case 'startquiz':
        p = place(P.id); P.run = newRun(p.quiz); P.step = 2; if (P.max < 2) { P.max = 2; } P.result = null;
        window.scrollTo(0, 0); render();
        break;
      case 'pick': onPick(b.getAttribute('data-ctx'), Number(b.getAttribute('data-j'))); break;
      case 'qnext': onNext(b.getAttribute('data-ctx')); break;
      case 'startexam': startExam(); window.scrollTo(0, 0); render(); break;
      case 'avatar': draft.avatar = Number(b.getAttribute('data-i')); draft.touched = true; render(); break;
      case 'create':
        if (!draft.name.replace(/\s/g, '')) { toast('Write your first name first.'); o = document.getElementById('pname'); if (o) { o.focus(); } break; }
        S.explorer = { name: draft.name.replace(/^\s+|\s+$/g, '').slice(0, 20), avatar: draft.avatar, since: today() };
        persist(); openPlace('arrival');
        break;
      case 'saveprofile':
        if (!draft.name.replace(/\s/g, '')) { toast('Your name cannot be empty.'); break; }
        S.explorer.name = draft.name.replace(/^\s+|\s+$/g, '').slice(0, 20); S.explorer.avatar = draft.avatar; persist(); toast('Passport updated.'); render();
        break;
      case 'set':
        o = b.getAttribute('data-val');
        S.settings[b.getAttribute('data-k')] = o === 'true' ? true : o === 'false' ? false : o;
        persist(); render();
        break;
      case 'card': p = place(b.getAttribute('data-id')); if (stamped(p.id)) { modal = { kind: 'card', id: p.id }; render(); } else { toast('Visit ' + p.name + ' to win this card.'); } break;
      case 'dest': if (b.getAttribute('data-id') === 'england') { go('map'); } else { toast('Coming soon: this destination is being prepared.'); } break;
      case 'export': download(JSON.stringify(S, null, 2), 'globetrotter-progress.json'); break;
      case 'import': o = document.getElementById('impfile'); if (o) { o.click(); } break;
      case 'askreset': modal = { kind: 'reset' }; render(); break;
      case 'closemodal': modal = null; render(); break;
      case 'doreset':
        try { localStorage.removeItem(SAVE_KEY); } catch (err) { }
        S = fresh(); P = null; EX = null; RV = null; modal = null; draft = { name: '', avatar: 0 };
        toast('Everything was deleted.'); go('home');
        break;
      case 'cleanlegacy':
        try { for (i = 0; i < LEGACY_KEYS.length; i++) { localStorage.removeItem(LEGACY_KEYS[i]); } } catch (err) { }
        toast('Old data deleted.'); render();
        break;
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'pname') { draft.name = e.target.value; draft.touched = true; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modal) { modal = null; render(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'pname' && V.name === 'create') {
      var b = document.querySelector('[data-act="create"]'); if (b) { b.click(); }
    }
  });
  document.addEventListener('change', function (e) {
    if (!e.target || e.target.id !== 'impfile' || !e.target.files || !e.target.files[0]) { return; }
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || d.v !== 2) { throw new Error('format'); }
        localStorage.setItem(SAVE_KEY, JSON.stringify(d));
        S = load(); toast('Progress imported.'); go('home');
      } catch (err) { toast('This file is not a Globetrotter v2 save.'); }
    };
    r.readAsText(e.target.files[0]);
  });

  render();
}());

</script>
</body>
</html>
